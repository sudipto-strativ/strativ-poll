server {
    listen 80;
    server_name vote.strativ.se;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vote.strativ.se;

    # Managed by certbot
    ssl_certificate     /etc/letsencrypt/live/vote.strativ.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vote.strativ.se/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/vote/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/vote/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/run/vote/vote.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
