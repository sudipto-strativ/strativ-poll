{% extends "base.html" %}
{% load socialaccount %}
{% block title %}Sign in — Strativ Poll{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:96px 0; text-align:center;">
  <svg width="48" height="48" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:24px;" aria-hidden="true">
    <rect width="28" height="28" rx="6" fill="#FE5001"/>
    <text x="14" y="20" text-anchor="middle" fill="white"
          font-family="'Expletus Sans', Georgia, serif"
          font-size="15" font-weight="700">S</text>
  </svg>
  <h1 style="font-size:2rem; font-weight:500; color:var(--warm-black); margin:0 0 10px; letter-spacing:-0.012em;">Sign in to Strativ Poll</h1>
  <p style="font-size:15px; color:var(--text-tertiary); max-width:320px; margin:0 0 32px; line-height:1.6;">Use your @strativ.se Google account to continue.</p>

  <a href="{% url 'google_login' %}" class="btn btn-primary btn-lg">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0;">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff" opacity=".9"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff" opacity=".9"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff" opacity=".9"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff" opacity=".9"/>
    </svg>
    Sign in with Google
  </a>
</div>
{% endblock %}
